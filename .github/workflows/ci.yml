name: CI

# Branch pushes are covered by their pull request; only main runs on push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.47.9' # keep in step with pubspec.yaml environment.flutter

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # The first (and so far only) place where Gradle really runs: the sandbox the
  # app was written in had no Maven/Google access. This job checks the
  # AGP 9.1 / Kotlin 2.4 app against the pose plugin's older Gradle setup
  # (see docs/android-build-notes.md and docs/known-limitations.md).
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      # AGP 9.x needs JDK 17 or newer (android/app/build.gradle.kts targets 17).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      # compileSdk is max(flutter's, 37) because permission_handler_android
      # needs 37. Best effort only: once the licences are accepted Gradle
      # fetches any missing platform / build tools itself, so none of these
      # installs may fail the job.
      - name: Install Android SDK parts (best effort)
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-37" || "$SDKMANAGER" "platforms;android-37.0" || true
          "$SDKMANAGER" "build-tools;36.0.0" || true
      - run: flutter pub get
      - run: flutter doctor -v
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
